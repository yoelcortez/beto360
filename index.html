<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beto360 - Bitácora con Sincronización</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f8fafc; color: #1e293b; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .estado-red { font-size: 12px; font-weight: bold; padding: 5px 10px; border-radius: 20px; }
    .online { background: #dcfce7; color: #166534; }
    .offline { background: #fee2e2; color: #991b1b; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
    textarea, input[type="url"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; margin-bottom: 10px; }
    button { background: #2563eb; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-size: 15px; cursor: pointer; width: 100%; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .grupo-botones { display: flex; gap: 10px; margin-bottom: 12px; }
    .btn-camara { background: #0284c7; }
    .btn-gps { background: #d97706; }
    .btn-sync { background: #7c3aed; margin-top: 4px; }
    .btn-exportar { background: #059669; }
    .btn-importar { background: #475569; }
    .btn-borrar { background: #ef4444; padding: 6px 12px; font-size: 13px; width: auto; margin-top: 10px; }
    .estado-info { font-size: 13px; color: #334155; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; display: none; }
    .registro { background: white; padding: 14px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid #2563eb; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .registro img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: block; }
    .fecha { font-size: 12px; color: #64748b; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .badge-sync { font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    .sincronizado { background: #dcfce7; color: #166534; }
    .pendiente { background: #fef9c3; color: #854d0e; }
    .gps-badge { display: inline-block; background: #fef3c7; color: #92400e; padding: 4px 8px; border-radius: 6px; font-size: 12px; margin-top: 8px; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2 style="margin:0;">📍 Beto360</h2>
    <span id="indicadorRed" class="estado-red">Verificando...</span>
  </div>

  <!-- Formulario principal -->
  <div class="card">
    <textarea id="textoNota" rows="3" placeholder="Escribe una descripción del lugar o actividad..."></textarea>
    
    <div class="grupo-botones">
      <button type="button" class="btn-camara" onclick="document.getElementById('fotoInput').click()">📷 Tomar Foto</button>
      <button type="button" class="btn-gps" id="btnGps" onclick="obtenerUbicacion()">📍 Capturar GPS</button>
    </div>

    <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display: none;" onchange="mostrarNombreFoto(event)">

    <div id="infoFoto" class="estado-info"></div>
    <div id="infoGps" class="estado-info"></div>

    <button onclick="guardarRegistro()">💾 Guardar Registro</button>
  </div>

  <!-- Configuración de Nube (Google Sheets) -->
  <div class="card">
    <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #475569;">☁️ Sincronización Automática (Google Sheets)</div>
    <input type="url" id="webhookUrl" placeholder="Pega aquí la URL de Google Apps Script..." onchange="guardarUrlNube()">
    <button class="btn-sync" onclick="sincronizarPendientes()">🔄 Sincronizar Pendientes Ahora</button>
  </div>

  <!-- Panel de Respaldo Local -->
  <div class="card">
    <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #475569;">💾 Copia de Seguridad Local</div>
    <div class="grupo-botones" style="margin-bottom: 0;">
      <button class="btn-exportar" onclick="exportarRespaldo()">⬇️ Exportar JSON</button>
      <button class="btn-importar" onclick="document.getElementById('importarInput').click()">⬆️ Restaurar JSON</button>
    </div>
    <input type="file" id="importarInput" accept=".json" style="display: none;" onchange="importarRespaldo(event)">
  </div>

  <div id="listaRegistros"></div>

  <script>
    let db;
    let ubicacionActual = null;

    // Cargar URL de Google Sheets guardada previamente
    document.getElementById('webhookUrl').value = localStorage.getItem('beto360_webhook') || '';

    function guardarUrlNube() {
      const url = document.getElementById('webhookUrl').value.trim();
      localStorage.setItem('beto360_webhook', url);
      sincronizarPendientes();
    }

    // Monitor de conexión a internet en tiempo real
    function actualizarEstadoRed() {
      const badge = document.getElementById('indicadorRed');
      if (navigator.onLine) {
        badge.textContent = '🟢 En línea';
        badge.className = 'estado-red online';
        sincronizarPendientes();
      } else {
        badge.textContent = '🔴 Sin internet (Modo Offline)';
        badge.className = 'estado-red offline';
      }
    }

    window.addEventListener('online', actualizarEstadoRed);
    window.addEventListener('offline', actualizarEstadoRed);

    // 1. Iniciar IndexedDB
    const request = indexedDB.open('Beto360DB', 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      db.createObjectStore('registros', { keyPath: 'id', autoIncrement: true });
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      actualizarEstadoRed();
      mostrarRegistros();
    };

    // 2. Foto y GPS
    function mostrarNombreFoto(event) {
      const archivo = event.target.files[0];
      const infoFoto = document.getElementById('infoFoto');
      if (archivo) {
        infoFoto.style.display = 'block';
        infoFoto.textContent = `📷 Foto lista: ${archivo.name}`;
      }
    }

    function obtenerUbicacion() {
      const infoGps = document.getElementById('infoGps');
      const btnGps = document.getElementById('btnGps');

      if (!('geolocation' in navigator)) return alert('Dispositivo sin GPS.');

      btnGps.disabled = true;
      btnGps.textContent = '⏳ Buscando satélites...';
      infoGps.style.display = 'block';
      infoGps.textContent = 'Obteniendo coordenadas...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          ubicacionActual = {
            lat: pos.coords.latitude.toFixed(6),
            lng: pos.coords.longitude.toFixed(6)
          };
          infoGps.innerHTML = `✅ <b>GPS fijado:</b> ${ubicacionActual.lat}, ${ubicacionActual.lng}`;
          btnGps.disabled = false;
          btnGps.textContent = '📍 Actualizar GPS';
        },
        () => {
          infoGps.textContent = '❌ No se pudo obtener el GPS.';
          btnGps.disabled = false;
          btnGps.textContent = '📍 Reintentar GPS';
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // 3. Guardar registro marcado como "sincronizado: false"
    function guardarRegistro() {
      const texto = document.getElementById('textoNota').value.trim();
      const archivoFoto = document.getElementById('fotoInput').files[0];

      if (!texto && !archivoFoto && !ubicacionActual) {
        return alert('Agrega una nota, foto o GPS.');
      }

      const nuevoRegistro = {
        texto: texto,
        fecha: new Date().toLocaleString(),
        imagen: archivoFoto || null,
        gps: ubicacionActual,
        sincronizado: false
      };

      const transaccion = db.transaction(['registros'], 'readwrite');
      transaccion.objectStore('registros').add(nuevoRegistro);

      transaccion.oncomplete = () => {
        document.getElementById('textoNota').value = '';
        document.getElementById('fotoInput').value = '';
        document.getElementById('infoFoto').style.display = 'none';
        document.getElementById('infoGps').style.display = 'none';
        document.getElementById('btnGps').textContent = '📍 Capturar GPS';
        ubicacionActual = null;
        mostrarRegistros();
        
        if (navigator.onLine) {
          sincronizarPendientes();
        }
      };
    }

    // 4. Sincronización automática con Google Sheets
    async function sincronizarPendientes() {
      const webhookUrl = document.getElementById('webhookUrl').value.trim() || localStorage.getItem('beto360_webhook');
      if (!webhookUrl || !navigator.onLine || !db) return;

      localStorage.setItem('beto360_webhook', webhookUrl);

      const transaccion = db.transaction(['registros'], 'readonly');
      const peticion = transaccion.objectStore('registros').getAll();

      peticion.onsuccess = async () => {
        const todos = peticion.result;
        const pendientes = todos.filter(r => !r.sincronizado);

        for (const reg of pendientes) {
          try {
            await fetch(webhookUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                fecha: reg.fecha,
                texto: reg.texto || '(Solo foto/GPS)',
                lat: reg.gps ? reg.gps.lat : '',
                lng: reg.gps ? reg.gps.lng : ''
              })
            });

            const txUpdate = db.transaction(['registros'], 'readwrite');
            reg.sincronizado = true;
            txUpdate.objectStore('registros').put(reg);
          } catch (error) {
            console.log('Error al sincronizar, se reintentará luego:', error);

for (const item of datosImportados) {
let imagenBlob = item.imagenBase64 ? await (await fetch(item.imagenBase64)).blob() : null;
const transaccion = db.transaction(['registros'], 'readwrite');
transaccion.objectStore('registros').add({
texto: item.texto,
fecha: item.fecha,
gps: item.gps || null,
sincronizado: item.sincronizado || false,
imagen: imagenBlob
});
}
alert(¡Se restauraron ${datosImportados.length} registros!);
mostrarRegistros();
} catch (error) {
alert('Archivo no válido.');
}
event.target.value = '';
};
reader.readAsText(archivo);
}
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./sw.js');
}
